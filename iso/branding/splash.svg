<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F1A"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B9AA0"/>
      <stop offset="100%" style="stop-color:#7DD3FC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g transform="translate(400, 250)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="120" font-weight="bold" fill="url(#accent)" text-anchor="middle" filter="url(#glow)">◆</text>
    <text x="0" y="80" font-family="system-ui, sans-serif" font-size="32" font-weight="300" fill="#F8FAFC" text-anchor="middle" letter-spacing="8">KI-DE</text>
    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle" letter-spacing="2">openPlank OS</text>
  </g>
  <rect x="250" y="480" width="300" height="4" rx="2" fill="#1E293B"/>
  <rect x="250" y="480" width="180" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;300;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">System wird gestartet...</text>
</svg>
